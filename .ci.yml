image: ghcr.io/zephyrproject-rtos/ci:v0.29.3
stages:
  - build
  - package-artifacts

variables:
  DEBIAN_FRONTEND: noninteractive
  ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains

build:
  stage: build
  script:
    - west init -l espi-debugger
    - west update
    - west zephyr-export
    - west build -p always -b mec172xevb_assy6906 espi-debugger

  artifacts:
    paths:
      - build/zephyr/zephyr*
      - build/zephyr/*.bin