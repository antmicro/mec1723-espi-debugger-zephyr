#Activate MEC172x eSPI V2 driver 
CONFIG_ESPI_XEC_V2=y
CONFIG_ESPI=y

#Map eSPI Peripheral Channel to UART1
CONFIG_ESPI_PERIPHERAL_CHANNEL=y
CONFIG_ESPI_PERIPHERAL_UART=y
CONFIG_ESPI_PERIPHERAL_UART_SOC_MAPPING=1

# Zephyr console routed to UART0
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100

#Disable unrealated eSPI functions
CONFIG_ESPI_PERIPHERAL_HOST_IO_PVT=n
CONFIG_ESPI_PERIPHERAL_DEBUG_PORT_80=n
CONFIG_ESPI_PERIPHERAL_8042_KBC=n
CONFIG_ESPI_OOB_CHANNEL=n
CONFIG_ESPI_FLASH_CHANNEL=n
CONFIG_ESPI_TAF=n
CONFIG_ESPI_TAF_XEC_V2=n
# Disable for mec1723 to check notifications
CONFIG_ESPI_AUTOMATIC_WARNING_ACKNOWLEDGE=n
# Sample code doesn't handle ACPI host communication
CONFIG_ESPI_PERIPHERAL_HOST_IO=n
